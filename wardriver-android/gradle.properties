# AndroidX artifacts (required for Jetpack Compose, Room, etc.).
android.useAndroidX=true

# AGP 9 enables built-in Kotlin by default; do not opt out (android.builtInKotlin=false).

# KSP 2.2.10-2.0.2 still registers generated dirs via kotlin.sourceSets; allow until KSP 2.3.4+.
android.disallowKotlinSourceSets=false

# Gradle daemon heap; AGP 9 + Compose builds benefit from extra headroom.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

# AGP 9.2 compatibility matrix requires JDK 17. Point Gradle at a JDK 17 install if needed:
# org.gradle.java.home=/usr/lib/jvm/java-17-openjdk-amd64
